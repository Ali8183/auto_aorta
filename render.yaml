services:
  - type: web
    name: auto-aorta
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
    autoDeploy: true
